name: CI & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-publish:
    name: Quality Checks & Go Indexing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thruqe
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: duosql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Install Tooling
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install golang.org/x/tools/cmd/deadcode@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Verify Code Quality & Cyclomatic Complexity
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          gocyclo -over 15 .
          deadcode -test ./...

      - name: Run Test Suite (Race Detection)
        run: |
          go test -v -race -timeout 120s ./...

      - name: Index on Go Module Proxy (pkg.go.dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Notifying proxy.golang.org to index latest commit from main..."
          GOPROXY=https://proxy.golang.org go list -m github.com/thruqe/duosql@main
          echo "Successfully published to Go proxy. Importable via: go get github.com/thruqe/duosql@main"
